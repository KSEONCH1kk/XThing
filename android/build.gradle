// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1'
        classpath 'com.google.gms:google-services:4.4.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
        // AAR из плагина capacitor-plugin-xthing-vpn (AndroidLibXrayLite).
        // flatDir в самом плагине gradle не пробрасывает в app-модуль —
        // объявляем тут глобально, чтобы и плагин, и app разрешали AAR
        // из одного места.
        flatDir {
            dirs new File(rootDir, "../capacitor-plugin-xthing-vpn/android/libs")
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
