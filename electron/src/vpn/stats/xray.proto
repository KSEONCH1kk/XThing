syntax = "proto3";

package xray.app.stats.command;

// Минимальный поднабор xray-core/app/stats/command/command.proto, достаточный
// для GetStats / QueryStats. Полный proto: github.com/XTLS/Xray-core
// /tree/main/app/stats/command/command.proto

message GetStatsRequest {
  string name = 1;
  bool reset = 2;
}

message Stat {
  string name = 1;
  int64 value = 2;
}

message GetStatsResponse {
  Stat stat = 1;
}

message QueryStatsRequest {
  string pattern = 1;
  bool reset = 2;
}

message QueryStatsResponse {
  repeated Stat stat = 1;
}

service StatsService {
  rpc GetStats(GetStatsRequest) returns (GetStatsResponse) {}
  rpc QueryStats(QueryStatsRequest) returns (QueryStatsResponse) {}
}
